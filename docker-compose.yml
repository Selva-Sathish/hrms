services:
  postgres:
    image: postgres:17
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: hrms
    volumes:
      - hrms_data:/var/lib/postgresql/data
      
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

  api-gateway:
    container_name: api-gateway 
    depends_on:
      - auth-service
      - user-service
      - organisation-service
      - role-service
    ports:
      - "8080:8080"
    volumes:
      - ./gateway:/app
      - maven-gateway:/root/.m2
    build: 
      context: ./gateway
      dockerfile: Dockerfile.dev
    environment:
      JWT_SECRET: LhFpXRkVzFv9trcGM6QZFa9EfnX8Bitqf4uMB7VOgCZ
  
  user-service:
    container_name: user-service
    depends_on:
      - postgres
      - kafka
    ports:
      - "8084:8080"
    volumes:
      - ./user:/app
      - maven-user:/root/.m2
      - ./user/src/main/java/com/example/user/security/keys/public-key.pem:/app/keys/public-key.pem:ro
    build: 
      context: ./user
      dockerfile: Dockerfile.dev
    environment:
      JWT_SECRET: LhFpXRkVzFv9trcGM6QZFa9EfnX8Bitqf4uMB7VOgCZ
      JWT_PUBLIC_KEY_PATH: /app/keys/public-key.pem
  auth-service:
    depends_on:
      - postgres
      - kafka
    container_name: auth-service
    volumes:
      - ./auth:/app
      - ./auth/src/main/java/com/example/auth/security/keys/private-key.pem:/app/keys/private-key.pem:ro
      - ./auth/src/main/java/com/example/auth/security/keys/public-key.pem:/app/keys/public-key.pem:ro
      - maven-auth:/root/.m2
    build: 
      context: ./auth
      dockerfile: Dockerfile.dev

    environment:
      JWT_PRIVATE_KEY_PATH: /app/keys/private-key.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/public-key.pem
      

    ports:
      - "8081:8080"

    restart: unless-stopped

  organisation-service:
    depends_on:
      - postgres
      - kafka
    container_name: organisation-service
    volumes:
      - ./organisation:/app
      - ./organisation/src/main/java/com/example/organisation/security/keys/public-key.pem:/app/keys/public-key.pem:ro
      - maven-organisation:/root/.m2
    build: 
      context: ./organisation
      dockerfile: Dockerfile.dev
    environment:
      JWT_PUBLIC_KEY_PATH: /app/keys/public-key.pem  
    ports:
      - "8082:8080"
    restart: unless-stopped
  
  role-service:
    depends_on:
      - postgres
      - kafka
    container_name: role-service
    volumes:
      - ./role:/app
      - maven-role:/root/.m2
    environment:
      JWT_PUBLIC_KEY_PATH: D:\hrms\auth\src\main\java\com\example\auth\security\keys\public-key.pem
    build: 
      context: ./role
      dockerfile: Dockerfile.dev
    ports:
      - "8083:8080"
    restart: unless-stopped

volumes:
  hrms_data:
  redis_data:
  maven-gateway:
  maven-user:
  maven-auth:
  maven-organisation:
  maven-role: