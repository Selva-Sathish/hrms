spring:
  application:
    name: user
  datasource:
    url: jdbc:postgresql://localhost:5432/hrms?ServerTimezone=UTC
    username: admin
    password: admin123
  
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: user-service-group
  
  data:
    redis:
      host: localhost
      port: 6379
